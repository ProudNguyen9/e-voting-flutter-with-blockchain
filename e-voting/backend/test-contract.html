<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contract Connection</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #log {
            background: #f5f5f5;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>🧪 Test Contract Connection</h1>

    <div>
        <label>Contract Address:</label><br>
        <input type="text" id="contractAddress" value="0x5FbDB2315678afecb367f032d93F642f64180aa3"
            style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-top: 20px;">
        <button onclick="connectWallet()">1. Kết nối MetaMask</button>
        <button onclick="testContract()">2. Test Contract</button>
        <button onclick="testElectionCounter()">3. Test electionCounter()</button>
        <button onclick="testGetElectionInfo()">4. Test getElectionInfo(1)</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div id="log"></div>

    <script>
        const CONTRACT_ABI = [
            "function admin() view returns (address)",
            "function electionCounter() view returns (uint256)",
            "function ballotCounter() view returns (uint256)",
            "function elections(uint256) view returns (uint256,string,string,uint256,uint256,uint8,address,bool,uint256,uint256)",
            "function candidates(uint256,uint256) view returns (uint256,string,string,string,uint256,bool)",
            "function candidateCounters(uint256) view returns (uint256)",
            "function hasVoted(uint256,address) view returns (bool)",
            "function isRegisteredVoter(uint256,address) view returns (bool)",
            "function createElection(string,string,uint256,uint256) returns (uint256)",
            "function addCandidate(uint256,string,string,string)",
            "function registerVoter(uint256,address)",
            "function registerVotersBatch(uint256,address[])",
            "function startVoting(uint256)",
            "function castVote(uint256,bytes,bytes32)",
            "function endVoting(uint256)",
            "function shuffleBallots(uint256,bytes32)",
            "function decryptAndTally(uint256,uint256[])",
            "function getResults(uint256) view returns (string,uint8,uint256,uint256,uint256)",
            "function getCandidate(uint256,uint256) view returns (string,string,string,uint256)",
            "function getAllCandidates(uint256) view returns (uint256[],string[],uint256[])",
            "function hasVoterVoted(uint256,address) view returns (bool)",
            "function getBallotCount(uint256) view returns (uint256)",
            "function getElectionInfo(uint256) view returns (string,string,uint256,uint256,uint8,uint256,uint256,uint256)",
            "function phaseToString(uint8) pure returns (string)",
            "function getAuditTrail(uint256) view returns (tuple(bytes32,bytes32,bytes32,uint256)[])",
            "function verifyBallotCommitment(uint256,uint256,bytes32) view returns (bool)"
        ];

        let provider, signer, contract, userAddress;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    log('❌ MetaMask chưa được cài đặt!', 'error');
                    return;
                }

                log('🔄 Đang kết nối MetaMask...');
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                log(`✅ Đã kết nối: ${userAddress}`, 'success');
                log(`📊 ABI có ${CONTRACT_ABI.length} function`, 'success');
            } catch (error) {
                log(`❌ Lỗi kết nối: ${error.message}`, 'error');
            }
        }

        async function testContract() {
            try {
                if (!provider) {
                    log('❌ Chưa kết nối MetaMask!', 'error');
                    return;
                }

                const contractAddress = document.getElementById('contractAddress').value;
                log(`🔄 Đang kết nối contract: ${contractAddress}...`);

                contract = new ethers.Contract(contractAddress, CONTRACT_ABI, signer);
                log('✅ Contract đã được khởi tạo', 'success');

                // Test admin()
                log('🔄 Đang gọi admin()...');
                const adminAddress = await contract.admin();
                log(`✅ Admin address: ${adminAddress}`, 'success');

                // Check if user is admin
                if (userAddress.toLowerCase() === adminAddress.toLowerCase()) {
                    log('👑 Bạn là ADMIN!', 'success');
                } else {
                    log('👤 Bạn là cử tri thường', 'info');
                }

            } catch (error) {
                log(`❌ Lỗi: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function testElectionCounter() {
            try {
                if (!contract) {
                    log('❌ Chưa kết nối contract!', 'error');
                    return;
                }

                log('🔄 Đang gọi electionCounter()...');
                const counter = await contract.electionCounter();
                log(`✅ Số bầu cử: ${counter.toString()}`, 'success');

            } catch (error) {
                log(`❌ Lỗi: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function testGetElectionInfo() {
            try {
                if (!contract) {
                    log('❌ Chưa kết nối contract!', 'error');
                    return;
                }

                log('🔄 Đang gọi getElectionInfo(1)...');
                const info = await contract.getElectionInfo(1);
                log(`✅ Election Info:`, 'success');
                log(`   Title: ${info[0]}`);
                log(`   Description: ${info[1]}`);
                log(`   Start Time: ${new Date(info[2].toNumber() * 1000).toLocaleString()}`);
                log(`   End Time: ${new Date(info[3].toNumber() * 1000).toLocaleString()}`);
                log(`   Phase: ${info[4]}`);
                log(`   Total Voters: ${info[5].toString()}`);
                log(`   Total Voted: ${info[6].toString()}`);
                log(`   Candidate Count: ${info[7].toString()}`);

            } catch (error) {
                log(`❌ Lỗi: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Auto connect on load
        window.addEventListener('load', async () => {
            log('📱 Trang đã load. Click "Kết nối MetaMask" để bắt đầu.');

            // Check if already connected
            if (typeof window.ethereum !== 'undefined') {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) {
                    log('🔄 Tự động kết nối lại...');
                    await connectWallet();
                }
            }
        });
    </script>
</body>

</html>
