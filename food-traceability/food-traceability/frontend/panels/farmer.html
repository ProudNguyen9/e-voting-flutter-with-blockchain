<div class="panel" id="panel-farmer">
    <h4 class="mb-1">
        <i class="bi bi-tree me-2 text-success"></i>Nông dân
    </h4>
    <p class="text-muted small mb-4">Tạo sản phẩm mới và đánh dấu thu hoạch</p>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h6 class="text-uppercase text-success fw-bold mb-3" style="font-size:.75rem;">
                Tạo sản phẩm mới (Planted)
            </h6>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small text-muted">Tên sản phẩm</label>
                    <input type="text" id="f-name" class="form-control" placeholder="VD: Cà Phê Arabica" />
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-muted">Vị trí trang trại</label>
                    <input type="text" id="f-location" class="form-control" placeholder="VD: Bảo Lộc, Lâm Đồng" />
                </div>
            </div>
            <button class="btn btn-success" onclick="createProduct()">
                <i class="bi bi-plus-circle me-1"></i>Tạo sản phẩm
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h6 class="text-uppercase text-warning fw-bold mb-3" style="font-size:.75rem;">
                Thu hoạch sản phẩm (Harvested)
            </h6>
            <div class="mb-3">
                <label class="form-label small text-muted">Product ID</label>
                <input type="number" id="f-harvest-id" class="form-control" placeholder="1" min="1" />
            </div>
            <button class="btn btn-warning text-white" onclick="harvestProduct()">
                <i class="bi bi-basket me-1"></i>Thu hoạch
            </button>
        </div>
    </div>
</div>
