<div class="panel" id="panel-trace">
    <h4 class="mb-1">
        <i class="bi bi-search me-2 text-success"></i>Tra cứu sản phẩm
    </h4>
    <p class="text-muted small mb-4">
        Người tiêu dùng tra cứu toàn bộ hành trình của sản phẩm
    </p>
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <label class="form-label small text-muted fw-bold">
                Nhập mã sản phẩm (Product ID)
            </label>
            <div class="input-group">
                <input type="number" id="traceId" class="form-control" placeholder="1" min="1" />
                <button class="btn btn-success" onclick="traceProduct()">
                    <i class="bi bi-search me-1"></i>Tra cứu
                </button>
            </div>
        </div>
    </div>
    <div id="traceResult" class="d-none">
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h6 class="text-success fw-bold mb-3">Hành trình sản phẩm</h6>
                <div id="traceTimeline" class="d-flex overflow-auto pb-2 gap-2"></div>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <h6 class="text-success fw-bold mb-3">Chi tiết thông tin</h6>
                <table class="table table-sm table-bordered" id="traceDetail"></table>
            </div>
        </div>
    </div>
</div>
