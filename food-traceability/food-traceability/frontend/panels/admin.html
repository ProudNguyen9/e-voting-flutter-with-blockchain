<div class="panel" id="panel-admin">
    <h4 class="mb-1">
        <i class="bi bi-person-gear me-2 text-success"></i>Quản lý Participants
    </h4>
    <p class="text-muted small mb-4">Chỉ Admin mới có quyền thêm/xóa người tham gia</p>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h6 class="text-uppercase text-success fw-bold mb-3" style="font-size:.75rem;">
                Thêm người tham gia mới
            </h6>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small text-muted">Địa chỉ ví (address)</label>
                    <input type="text" id="p-address" class="form-control font-monospace" placeholder="0x..." />
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-muted">Tên công ty / cá nhân</label>
                    <input type="text" id="p-name" class="form-control" placeholder="VD: Nông Trại Xanh" />
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-muted">Vai trò</label>
                    <select id="p-role" class="form-select">
                        <option value="1">🌱 Farmer — Nông dân</option>
                        <option value="2">🏭 Manufacturer — Nhà máy</option>
                        <option value="3">🚚 Distributor — Nhà phân phối</option>
                        <option value="4">🏪 Retailer — Siêu thị</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-success mt-3" onclick="addParticipant()">
                <i class="bi bi-plus-circle me-1"></i>Thêm Participant
            </button>
        </div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h6 class="text-uppercase text-danger fw-bold mb-3" style="font-size:.75rem;">
                Xóa người tham gia
            </h6>
            <div class="input-group">
                <input type="text" id="p-remove-address" class="form-control font-monospace" placeholder="0x..." />
                <button class="btn btn-outline-danger" onclick="removeParticipant()">
                    <i class="bi bi-trash me-1"></i>Xóa
                </button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h6 class="text-uppercase text-secondary fw-bold mb-3" style="font-size:.75rem;">
                Kiểm tra thông tin
            </h6>
            <div class="input-group mb-3">
                <input type="text" id="p-check-address" class="form-control font-monospace" placeholder="0x..." />
                <button class="btn btn-outline-success" onclick="checkParticipant()">
                    <i class="bi bi-search me-1"></i>Kiểm tra
                </button>
            </div>
            <div id="participantInfo"></div>
        </div>
    </div>
</div>
